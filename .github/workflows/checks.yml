name: Portfolio checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run check:architecture
      - run: npm run lint
      - run: npx next build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- e2e/home.spec.ts e2e/admin.spec.ts e2e/features.spec.ts
